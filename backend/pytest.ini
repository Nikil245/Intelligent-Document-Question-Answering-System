[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: uses the real pretrained DistilBERT model (downloads ~260 MB on first run). Enable with RUN_INTEGRATION_TESTS=1.
filterwarnings =
    ignore::DeprecationWarning:pymupdf.*
    ignore::DeprecationWarning:transformers.*
    ignore::FutureWarning
